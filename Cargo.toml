[package]
name = "shellenv"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
shellenv-core = { path = "crates/shellenv-core" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[workspace]
members = ["crates/shellenv-core"]
resolver = "2"
